name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q MovieBox-android.zip -d src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: src
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp src/app/build/outputs/apk/debug/app-debug.apk MovieBox.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MovieBox-apk
          path: MovieBox.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MovieBox latest
          body: "Newest build. Download MovieBox.apk and install it on your phone."
          files: MovieBox.apk

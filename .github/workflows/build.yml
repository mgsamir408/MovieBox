name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -E -A4 "^e: |What went wrong|error:|FAILURE" build.log | head -45 | cut -c1-300 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Gradle build failed::$msg"
          fi
          exit $code

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MovieBox.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MovieBox-apk
          path: MovieBox.apk

      # Direct download link: Releases page -> "MovieBox latest" -> MovieBox.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MovieBox latest
          body: "Newest build. Download MovieBox.apk and install it on your phone."
          files: MovieBox.apk
